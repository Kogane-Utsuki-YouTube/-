<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向重力スイカゲーム (チート版)</title>
<style>
  :root{
    --bg1:#1a1a2e;
    --bg2:#16213e;
    --panel:#0f3460;
    --accent:#e94560;
    --cheat:#ffd700;
    --text:#f1f1f1;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    font-family:"Segoe UI","Yu Gothic",sans-serif;
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
  }
  #app{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    height:100%;
    padding:8px;
  }
  h1{
    font-size:20px;
    margin:4px 0;
    letter-spacing:1px;
    color:var(--accent);
    text-shadow:0 0 8px rgba(233,69,96,.6);
  }
  #hud{
    display:flex;
    gap:16px;
    align-items:center;
    margin-bottom:6px;
    font-size:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  #hud .item{
    background:rgba(255,255,255,.06);
    padding:4px 10px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.1);
  }
  #gravityIndicator{
    position:relative;
    width:60px;
    height:60px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #24345a, #0c1730);
    border:2px solid var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #arrow{
    width:0;height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-bottom:26px solid var(--accent);
    transform-origin:center 60%;
    filter:drop-shadow(0 0 4px rgba(233,69,96,.9));
    transition:transform .12s linear;
  }
  #canvasWrap{
    position:relative;
    border-radius:12px;
    box-shadow:0 0 0 3px var(--panel), 0 8px 24px rgba(0,0,0,.5);
    overflow:hidden;
    background:#fdf6e3;
  }
  canvas{display:block;touch-action:none;}
  #gameOverOverlay{
    position:absolute;
    inset:0;
    background:rgba(10,10,20,.85);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    z-index:10;
  }
  #gameOverOverlay h2{
    color:var(--accent);
    font-size:28px;
    margin:0;
  }
  #gameOverOverlay p{margin:0;font-size:16px;}
  button{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 22px;
    font-size:15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    letter-spacing:1px;
  }
  button:hover{filter:brightness(1.1);}
  button:disabled{opacity:0.4;cursor:not-allowed;filter:none;}
  .touch-btn{
    background:#1e3a5f;
    border:1px solid rgba(255,255,255,.2);
    border-radius:8px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
    touch-action:manipulation;
  }
  .touch-btn:active{background:#2e5a8f;}
  @media (max-width:600px){
    h1{font-size:15px;}
    #hud{gap:6px;font-size:12px;}
    #hud .item{padding:3px 7px;}
    #touchControls{display:flex!important;}
    #help{font-size:11px;}
  }
  @media (hover:none) and (pointer:coarse){
    /* タッチデバイス全般 */
    #touchControls{display:flex!important;}
  }
  .cheat-mode-btn{
    background:#e67e22;
  }
  .cheat-active{
    background:var(--cheat) !important;
    color:#000 !important;
  }
  #help{
    margin-top:8px;
    font-size:12px;
    color:#aaa;
    text-align:center;
    line-height:1.6;
    max-width:480px;
  }
  #help b{color:var(--accent);}
  #help b.cheat-text{color:var(--cheat);}
  .touchhint{display:none;}
  @media (max-width:520px){
    .touchhint{display:block;font-size:11px;color:#888;margin-top:4px;}
  }
</style>
</head>
<body>
<div id="app">
  <h1>🍉 方向重力スイカゲーム 🍉</h1>
  <div id="hud">
    <div class="item">スコア: <span id="score">0</span></div>
    <div class="item">ベスト: <span id="best">0</span></div>
    <div class="item nextPreview">次: <span id="nextCircle" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#ff6b6b;color:#fff;font-weight:bold;font-size:12px;vertical-align:middle;"></span></div>
    <div class="item">重力強度: <span id="gravVal">1.0</span></div>
    <div class="item">角度: <span id="gravAngleVal">90°</span></div>
    <button id="shuffleBtn" style="padding:4px 12px;font-size:13px;">🔄 かき混ぜ (<span id="shuffleTimer">OK</span>)</button>
    <button id="cheatBtn" class="cheat-mode-btn" style="padding:4px 12px;font-size:13px;">⚡ チート: OFF</button>
    <div id="cheatNextWrap" style="display:none;align-items:center;gap:6px;background:rgba(255,215,0,.12);border:1px solid gold;border-radius:8px;padding:4px 10px;font-size:13px;">
      次指定:
      <select id="cheatNextSelect" style="background:#1a1a2e;color:#ffd700;border:1px solid gold;border-radius:4px;padding:2px 4px;font-size:13px;"></select>
    </div>
    <div id="gravityIndicator">
      <div id="arrow"></div>
    </div>
  </div>
  <div id="canvasWrap">
    <canvas id="game"></canvas>
    <div id="gameOverOverlay">
      <h2>ゲームオーバー</h2>
      <p>スコア: <span id="finalScore">0</span></p>
      <button id="retryBtn">もう一度</button>
    </div>
    <!-- かき混ぜ中のオーバーレイ表示 -->
    <div id="shuffleOverlay" style="position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:5;">
      <div style="background:rgba(0,0,0,.55);border-radius:12px;padding:10px 22px;color:#ffd700;font-size:18px;font-weight:bold;letter-spacing:2px;">🔄 かき混ぜ中…</div>
    </div>
    <!-- グレース期間表示 -->
    <div id="graceOverlay" style="position:absolute;top:8px;left:50%;transform:translateX(-50%);display:none;pointer-events:none;z-index:5;">
      <div style="background:rgba(46,204,113,.75);border-radius:8px;padding:4px 14px;color:#fff;font-size:13px;font-weight:bold;">🛡️ 無敵 <span id="graceTimer">5</span>s</div>
    </div>
  </div>

  <!-- スマホ用タッチコントロール -->
  <div id="touchControls" style="display:none;flex-direction:column;align-items:center;gap:6px;margin-top:8px;width:100%;max-width:480px;">
    <div style="display:flex;gap:8px;justify-content:center;width:100%;">
      <button class="touch-btn" id="tLeft"  style="flex:1;padding:10px 0;font-size:18px;">◀ 重力←</button>
      <button class="touch-btn" id="tRight" style="flex:1;padding:10px 0;font-size:18px;">重力→ ▶</button>
    </div>
    <div style="display:flex;gap:8px;justify-content:center;width:100%;">
      <button class="touch-btn" id="tUp"   style="flex:1;padding:8px 0;font-size:14px;">▲ 強度+</button>
      <button class="touch-btn" id="tDown" style="flex:1;padding:8px 0;font-size:14px;">▼ 強度−</button>
    </div>
  </div>

  <div style="display:flex;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap;justify-content:center;">
    <button id="resetBestBtn" style="background:#555;padding:4px 12px;font-size:12px;">🗑️ 記録リセット</button>
  </div>
  <div id="help">
    <b>←→</b>：重力回転 <b>↑↓</b>：強度 <b>クリック/タップ</b>：落とす<br>
    <b class="cheat-text">⚡ チート</b>：ON時 ①フルーツを2つタップで強制合体 ②「次指定」で落とすフルーツを固定<br>
    <b>🔄 かき混ぜ</b>：使用後60秒クールダウン ｜ <b>🗑️ 記録リセット</b>：2段階確認あり
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= 基本設定 ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const LOGICAL_W = 480;
const LOGICAL_H = 640;
let SCALE = 1;

function resize(){
  const hudH = document.getElementById('hud').getBoundingClientRect().height || 80;
  const touchH = window.innerWidth <= 600 ? 100 : 0;
  const maxW = Math.min(window.innerWidth - 16, 480);
  const maxH = window.innerHeight - hudH - touchH - 60;
  const scale = Math.min(maxW / LOGICAL_W, maxH / LOGICAL_H, 1.15);
  SCALE = Math.max(scale, 0.38);
  canvas.width  = LOGICAL_W * SCALE;
  canvas.height = LOGICAL_H * SCALE;
}
window.addEventListener('resize', resize);
resize();

/* ================= フルーツ定義 (1〜11) ================= */
const FRUITS = [
  { level:1,  radius:14, color:"#ff5e5e", score:1  , name:"さくらんぼ"},
  { level:2,  radius:19, color:"#ff9f43", score:3  , name:"いちご"},
  { level:3,  radius:25, color:"#feca57", score:6  , name:"ぶどう"},
  { level:4,  radius:31, color:"#ff6b81", score:10 , name:"みかん"},
  { level:5,  radius:38, color:"#54a0ff", score:15 , name:"かき"},
  { level:6,  radius:46, color:"#5f27cd", score:21 , name:"りんご"},
  { level:7,  radius:55, color:"#1dd1a1", score:28 , name:"なし"},
  { level:8,  radius:65, color:"#ff9ff3", score:36 , name:"もも"},
  { level:9,  radius:76, color:"#f368e0", score:45 , name:"パイナップル"},
  { level:10, radius:88, color:"#10ac84", score:55 , name:"メロン"},
  { level:11, radius:102,color:"#2ecc71", score:66 , name:"スイカ"},
];
const MAX_LEVEL = 11;
const MERGE_BONUS_ON_MAX = 500;

/* ================= 重力システム ================= */
let gravityAngle = Math.PI/2;
let gravityStrength = 800.0;
const ANGLE_STEP = Math.PI/180;
const STRENGTH_STEP = 20;
const STRENGTH_MIN = 100.0;
const STRENGTH_MAX = 2400.0;

function updateGravityIndicator(){
  const arrow = document.getElementById('arrow');
  arrow.style.transform = `rotate(${(gravityAngle*180/Math.PI)-90}deg)`;
  document.getElementById('gravVal').textContent = Math.round(gravityStrength);
  const angDeg = document.getElementById('gravAngleVal');
  if (angDeg) angDeg.textContent = Math.round(((gravityAngle*180/Math.PI)%360+360)%360) + "°";
}

/* ================= 物理エンジン ================= */
const WALL_THICKNESS = 14;
const LEFT_X = WALL_THICKNESS + 10;
const RIGHT_X = LOGICAL_W - WALL_THICKNESS - 10;
const TOP_LIMIT_Y = 90;

let balls = [];
let idCounter = 1;
let score = 0;
let best = parseInt(localStorage.getItem('suika_best_gravity') || "0", 10);
document.getElementById('best').textContent = best;

let gameOver = false;
let dropCooldown = 0;
const DROP_COOLDOWN_MAX = 0.65;
let isDropping = false;

/* ================= チート機能の変数 ================= */
let cheatEnabled = false;
let selectedBall = null;

const cheatBtn = document.getElementById('cheatBtn');
const cheatNextWrap = document.getElementById('cheatNextWrap');
const cheatNextSelect = document.getElementById('cheatNextSelect');

// 次指定セレクトの選択肢を生成
FRUITS.forEach(f => {
  const opt = document.createElement('option');
  opt.value = f.level;
  opt.textContent = `${f.level}: ${f.name}`;
  cheatNextSelect.appendChild(opt);
});
// 「ランダム」を先頭に追加
const randOpt = document.createElement('option');
randOpt.value = 0;
randOpt.textContent = '0: ランダム';
cheatNextSelect.insertBefore(randOpt, cheatNextSelect.firstChild);
cheatNextSelect.value = 0;

// セレクト変更時に即反映
cheatNextSelect.addEventListener('change', () => {
  const v = parseInt(cheatNextSelect.value);
  if (v >= 1 && v <= MAX_LEVEL){
    nextLevel = v;
    refreshNextPreview();
  } else {
    nextLevel = randomDropLevel();
    refreshNextPreview();
  }
});

cheatBtn.addEventListener('click', () => {
  cheatEnabled = !cheatEnabled;
  if (cheatEnabled) {
    cheatBtn.textContent = "⚡ チート: ON";
    cheatBtn.classList.add('cheat-active');
    cheatNextWrap.style.display = 'flex';
  } else {
    cheatBtn.textContent = "⚡ チート: OFF";
    cheatBtn.classList.remove('cheat-active');
    cheatNextWrap.style.display = 'none';
    cheatNextSelect.value = 0;
    selectedBall = null;
  }
});

function randomDropLevel(){
  const r = Math.random();
  if (r < 0.35) return 1;
  if (r < 0.6) return 2;
  if (r < 0.8) return 3;
  if (r < 0.93) return 4;
  return 5;
}

let nextLevel = randomDropLevel();
function refreshNextPreview(){
  const f = FRUITS[nextLevel-1];
  const el = document.getElementById('nextCircle');
  el.style.background = f.color;
  el.textContent = f.level;
}
refreshNextPreview();

function createBall(x, y, level){
  const f = FRUITS[level-1];
  return {
    id: idCounter++,
    x, y,
    vx: 0, vy: 0,
    level,
    r: f.radius,
    settled:false,
    justDropped:true,
    dropTime: performance.now()
  };
}

const DROP_Y_FIXED = TOP_LIMIT_Y - 45;
let cursorX = LOGICAL_W/2;
function getDropSpawnInfo(){
  const r = FRUITS[nextLevel-1].radius;
  const cx = Math.min(Math.max(cursorX, LEFT_X+r), RIGHT_X-r);
  return {x: cx, y: DROP_Y_FIXED};
}

function dropBall(){
  if (gameOver) return;
  if (dropCooldown > 0) return;
  const info = getDropSpawnInfo();
  const b = createBall(info.x, info.y, nextLevel);
  balls.push(b);
  dropCooldown = DROP_COOLDOWN_MAX;
  isDropping = true;
  // チートで次指定中ならそのレベルをキープ、そうでなければランダム
  const cheatVal = cheatEnabled ? parseInt(cheatNextSelect.value) : 0;
  if (cheatVal >= 1 && cheatVal <= MAX_LEVEL){
    nextLevel = cheatVal;
  } else {
    nextLevel = randomDropLevel();
  }
  refreshNextPreview();
}

/* ================= マージ処理 ================= */
let pendingMerges = [];
let popEffects = [];

function forceMerge(a, b){
  a.merging = true;
  b.merging = true;
  pendingMerges.push({a, b, forced: true});
}

function tryMerge(a, b){
  if (a.level !== b.level) return false;
  if (a.merging || b.merging) return false;
  const dx = b.x-a.x, dy = b.y-a.y;
  const dist = Math.hypot(dx,dy);
  if (dist < a.r + b.r){
    a.merging = true; b.merging = true;
    pendingMerges.push({a,b});
    return true;
  }
  return false;
}

function processMerges(){
  for (const m of pendingMerges){
    const {a,b,forced} = m;
    if (!balls.includes(a) || !balls.includes(b)) continue;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    
    // チートで強制合体の場合は、2つのうちレベルの高い方をベースに+1する
    const targetLevel = forced ? Math.max(a.level, b.level) : a.level;

    if (targetLevel >= MAX_LEVEL){
      balls = balls.filter(x=>x!==a && x!==b);
      score += MERGE_BONUS_ON_MAX;
      popEffects.push({x:mx,y:my,r:a.r*1.4,life:0.5,maxLife:0.5,color:"#2ecc71"});
    } else {
      const newLevel = targetLevel + 1;
      balls = balls.filter(x=>x!==a && x!==b);
      const nb = createBall(mx,my,newLevel);
      nb.justDropped = false;
      balls.push(nb);
      score += FRUITS[newLevel-1].score;
      popEffects.push({x:mx,y:my,r:nb.r*1.2,life:0.3,maxLife:0.3,color:FRUITS[newLevel-1].color});
    }
    updateScoreUI();
  }
  pendingMerges = [];
}

function updateScoreUI(){
  document.getElementById('score').textContent = score;
  if (score > best){
    best = score;
    localStorage.setItem('suika_best_gravity', String(best));
    document.getElementById('best').textContent = best;
  }
}

/* ================= ゲームオーバー判定 ================= */
const GAME_OVER_LINE_Y = TOP_LIMIT_Y + 10;
function checkGameOver(dt){
  if (isDropping) return;
  if (isShuffling) return;
  if (gameOverGraceLeft > 0) return;
  for (const b of balls){
    if (b.y - b.r < GAME_OVER_LINE_Y){
      triggerGameOver();
      break;
    }
  }
}

function triggerGameOver(){
  if (gameOver) return;
  gameOver = true;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOverOverlay').style.display = 'flex';
}

function resetGame(){
  balls = [];
  score = 0;
  gameOver = false;
  isDropping = false;
  dropCooldown = 0;
  cursorX = LOGICAL_W/2;
  selectedBall = null;
  updateScoreUI();
  document.getElementById('gameOverOverlay').style.display = 'none';
  nextLevel = randomDropLevel();
  refreshNextPreview();
  shuffleCooldownLeft = 0;
  isShuffling = false;
  gameOverGraceLeft = 0;
  updateShuffleUI();
}
document.getElementById('retryBtn').addEventListener('click', resetGame);

/* ================= 入力: キーボード ================= */
window.addEventListener('keydown', (e)=>{
  switch(e.key){
    case 'ArrowLeft':
      gravityAngle -= ANGLE_STEP;
      if (!gameOver && !isDropping) cursorX = Math.max(LEFT_X + FRUITS[nextLevel-1].radius, cursorX - 10);
      updateGravityIndicator();
      e.preventDefault();
      break;
    case 'ArrowRight':
      gravityAngle += ANGLE_STEP;
      if (!gameOver && !isDropping) cursorX = Math.min(RIGHT_X - FRUITS[nextLevel-1].radius, cursorX + 10);
      updateGravityIndicator();
      e.preventDefault();
      break;
    case 'ArrowUp':
      gravityStrength = Math.min(STRENGTH_MAX, gravityStrength + STRENGTH_STEP);
      updateGravityIndicator();
      e.preventDefault();
      break;
    case 'ArrowDown':
      gravityStrength = Math.max(STRENGTH_MIN, gravityStrength - STRENGTH_STEP);
      updateGravityIndicator();
      e.preventDefault();
      break;
    case ' ':
      if (gameOver) resetGame(); else dropBall();
      e.preventDefault();
      break;
    case 'Escape':
      selectedBall = null;
      break;
    case 'r': case 'R':
      resetGame();
      e.preventDefault();
      break;
  }
});

/* ================= クリック/タップによる判定処理 ================= */
function getBallAt(lx, ly){
  for (let i = balls.length - 1; i >= 0; i--){
    const b = balls[i];
    const dist = Math.hypot(b.x - lx, b.y - ly);
    if (dist <= b.r) return b;
  }
  return null;
}

function handlePointerDown(lx, ly){
  if (gameOver){ resetGame(); return; }

  // チートモード有効時の処理
  if (cheatEnabled){
    const clickedBall = getBallAt(lx, ly);
    if (clickedBall){
      if (!selectedBall){
        // 1つ目の選択
        selectedBall = clickedBall;
      } else if (selectedBall === clickedBall){
        // 同じものをタップしたら解除
        selectedBall = null;
      } else {
        // 2つ目を選択して強制合体
        forceMerge(selectedBall, clickedBall);
        selectedBall = null;
      }
      return;
    } else {
      // フルーツ以外の場所をクリックで選択解除
      selectedBall = null;
    }
  }

  // 通常のドロップ処理
  cursorX = lx;
  dropBall();
}

canvas.addEventListener('mousemove', (e)=>{
  if (isDropping || gameOver) return;
  const rect = canvas.getBoundingClientRect();
  cursorX = (e.clientX-rect.left)/SCALE;
});

canvas.addEventListener('click', (e)=>{
  const rect = canvas.getBoundingClientRect();
  const lx = (e.clientX-rect.left)/SCALE;
  const ly = (e.clientY-rect.top)/SCALE;
  handlePointerDown(lx, ly);
});

canvas.addEventListener('touchstart', (e)=>{
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  const lx = (t.clientX-rect.left)/SCALE;
  const ly = (t.clientY-rect.top)/SCALE;
  handlePointerDown(lx, ly);
  e.preventDefault();
}, {passive:false});

updateGravityIndicator();

/* ================= 記録リセット(2段階警告) ================= */
let resetBestStage = 0;
let resetBestTimer = null;
const resetBestBtn = document.getElementById('resetBestBtn');
resetBestBtn.addEventListener('click', () => {
  if (resetBestStage === 0){
    resetBestStage = 1;
    resetBestBtn.textContent = '⚠️ 本当にリセット？';
    resetBestBtn.style.background = '#e67e22';
    resetBestTimer = setTimeout(() => {
      resetBestStage = 0;
      resetBestBtn.textContent = '🗑️ 記録リセット';
      resetBestBtn.style.background = '#555';
    }, 4000);
  } else {
    clearTimeout(resetBestTimer);
    resetBestStage = 0;
    best = 0;
    localStorage.removeItem('suika_best_gravity');
    document.getElementById('best').textContent = 0;
    resetBestBtn.textContent = '✅ リセット完了';
    resetBestBtn.style.background = '#27ae60';
    setTimeout(() => {
      resetBestBtn.textContent = '🗑️ 記録リセット';
      resetBestBtn.style.background = '#555';
    }, 2000);
  }
});

/* ================= スマホ用タッチボタン ================= */
function setupTouchBtn(id, action){
  const el = document.getElementById(id);
  if (!el) return;
  let interval = null;
  const start = (e) => { e.preventDefault(); action(); interval = setInterval(action, 80); };
  const stop  = (e) => { if(e) e.preventDefault(); clearInterval(interval); interval = null; };
  el.addEventListener('touchstart', start, {passive:false});
  el.addEventListener('touchend',   stop,  {passive:false});
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup',   stop);
  el.addEventListener('mouseleave',stop);
}
setupTouchBtn('tLeft',  () => { gravityAngle -= ANGLE_STEP * 5; updateGravityIndicator(); });
setupTouchBtn('tRight', () => { gravityAngle += ANGLE_STEP * 5; updateGravityIndicator(); });
setupTouchBtn('tUp',    () => { gravityStrength = Math.min(STRENGTH_MAX, gravityStrength + STRENGTH_STEP); updateGravityIndicator(); });
setupTouchBtn('tDown',  () => { gravityStrength = Math.max(STRENGTH_MIN, gravityStrength - STRENGTH_STEP); updateGravityIndicator(); });

/* ================= グレース期間UI更新 ================= */
function updateGraceUI(){
  const graceEl   = document.getElementById('graceOverlay');
  const timerEl   = document.getElementById('graceTimer');
  const shuffleEl = document.getElementById('shuffleOverlay');
  if (isShuffling){
    if (graceEl)   graceEl.style.display   = 'none';
    if (shuffleEl) shuffleEl.style.display = 'flex';
  } else if (gameOverGraceLeft > 0){
    if (shuffleEl) shuffleEl.style.display = 'none';
    if (graceEl)   graceEl.style.display   = 'flex';
    if (timerEl)   timerEl.textContent     = Math.ceil(gameOverGraceLeft);
  } else {
    if (shuffleEl) shuffleEl.style.display = 'none';
    if (graceEl)   graceEl.style.display   = 'none';
  }
}
const SHUFFLE_COOLDOWN = 60;
let shuffleCooldownLeft = 0;
let isShuffling = false;
let shuffleStartAngle = 0;
let shuffleStartStrength = 800;
let shuffleElapsed = 0;
const SHUFFLE_DURATION = 4.0;
const SHUFFLE_SPINS = 3;
let gameOverGraceLeft = 0;

function doShuffle(){
  if (isShuffling || shuffleCooldownLeft > 0) return;
  isShuffling = true;
  shuffleElapsed = 0;
  shuffleStartAngle = gravityAngle;
  shuffleStartStrength = gravityStrength;
  shuffleCooldownLeft = SHUFFLE_COOLDOWN;
  updateShuffleUI();
}

function updateShuffle(dt){
  if (isShuffling){
    shuffleElapsed += dt;
    const t = Math.min(shuffleElapsed / SHUFFLE_DURATION, 1);
    const ease = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    gravityAngle = shuffleStartAngle + ease * (Math.PI*2*SHUFFLE_SPINS);
    gravityStrength = shuffleStartStrength + Math.sin(shuffleElapsed*40) * shuffleStartStrength*0.3*(1-t);
    if (t >= 1){
      gravityAngle = ((shuffleStartAngle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
      gravityStrength = shuffleStartStrength;
      isShuffling = false;
      gameOverGraceLeft = 5;
    }
    updateGravityIndicator();
  }

  if (shuffleCooldownLeft > 0){
    shuffleCooldownLeft = Math.max(0, shuffleCooldownLeft - dt);
    updateShuffleUI();
  }
  if (gameOverGraceLeft > 0){
    gameOverGraceLeft = Math.max(0, gameOverGraceLeft - dt);
  }
}

function updateShuffleUI(){
  const btn = document.getElementById('shuffleBtn');
  const el = document.getElementById('shuffleTimer');
  if (shuffleCooldownLeft > 0){
    if (el) el.textContent = Math.ceil(shuffleCooldownLeft);
    if (btn) btn.disabled = true;
  } else {
    if (el) el.textContent = "OK";
    if (btn) btn.disabled = false;
  }
}

document.getElementById('shuffleBtn').addEventListener('click', doShuffle);

/* ================= メインループ ================= */
let lastTime = performance.now();

function step(now){
  let dt = (now-lastTime)/1000;
  lastTime = now;
  dt = Math.min(dt, 1/30);

  if (isDropping){
    dropCooldown -= dt;
    if (dropCooldown <= 0){ isDropping = false; }
  }

  if (!gameOver){
    updatePhysics(dt);
    checkGameOver(dt);
    updateShuffle(dt);
  }
  updatePopEffects(dt);
  updateGraceUI();
  render();
  requestAnimationFrame(step);
}

const SUBSTEPS = 8;
const DAMPING = 0.4;
const FRICTION = 0.88;
const WALL_BOUNCE = 0.6;

function updatePhysics(dt){
  const subDt = dt / SUBSTEPS;
  const gx = gravityStrength * Math.cos(gravityAngle);
  const gy = gravityStrength * Math.sin(gravityAngle);

  for (let s=0; s<SUBSTEPS; s++){
    for (const b of balls){
      if (b.merging) continue;
      b.vx += gx*subDt;
      b.vy += gy*subDt;
      b.x  += b.vx*subDt;
      b.y  += b.vy*subDt;
    }

    for (const b of balls){
      if (b.merging) continue;
      const r = b.r;
      if (b.x - r < LEFT_X){ b.x = LEFT_X + r; b.vx = Math.abs(b.vx) * WALL_BOUNCE; }
      if (b.x + r > RIGHT_X){ b.x = RIGHT_X - r; b.vx = -Math.abs(b.vx) * WALL_BOUNCE; }
      if (b.y - r < WALL_THICKNESS){ b.y = WALL_THICKNESS + r; b.vy = Math.abs(b.vy) * WALL_BOUNCE; }
      if (b.y + r > LOGICAL_H - WALL_THICKNESS){
        b.y = LOGICAL_H - WALL_THICKNESS - r;
        b.vy = -Math.abs(b.vy) * DAMPING;
        b.vx *= FRICTION;
      }
    }

    const n = balls.length;
    for (let i=0;i<n;i++){
      const a = balls[i];
      if (!a || a.merging) continue;
      for (let j=i+1;j<n;j++){
        const b = balls[j];
        if (!b || b.merging) continue;
        const dx=b.x-a.x, dy=b.y-a.y;
        const dist = Math.hypot(dx,dy);
        const minD = a.r+b.r;
        if (dist < minD && dist > 0.001){
          if (a.level === b.level && !a.justDropped && !b.justDropped){
            tryMerge(a,b);
            continue;
          }
          const nx = dx/dist, ny = dy/dist;
          const overlap = (minD-dist)*0.5;
          a.x -= nx*overlap; a.y -= ny*overlap;
          b.x += nx*overlap; b.y += ny*overlap;
          const rvx = b.vx-a.vx, rvy = b.vy-a.vy;
          const dot = rvx*nx + rvy*ny;
          if (dot < 0){
            const imp = dot * 0.55;
            a.vx += imp*nx; a.vy += imp*ny;
            b.vx -= imp*nx; b.vy -= imp*ny;
          }
        }
      }
    }
  }

  for (const b of balls){
    if (b.justDropped && performance.now() - b.dropTime > 200){
      b.justDropped = false;
    }
  }

  if (pendingMerges.length>0) processMerges();
  balls = balls.filter(b=>!b.merging || pendingMerges.some(m=>m.a===b||m.b===b));
}

function updatePopEffects(dt){
  for (const p of popEffects){
    p.life -= dt;
  }
  popEffects = popEffects.filter(p=>p.life>0);
}

/* ================= 描画 ================= */
function render(){
  ctx.save();
  ctx.scale(SCALE, SCALE);
  ctx.clearRect(0,0,LOGICAL_W,LOGICAL_H);

  // 背景
  const grad = ctx.createLinearGradient(0,0,0,LOGICAL_H);
  grad.addColorStop(0, "#fff8e7");
  grad.addColorStop(1, "#ffe9c7");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);

  // 上部危険ライン
  ctx.strokeStyle = "rgba(233,69,96,0.4)";
  ctx.setLineDash([6,6]);
  ctx.beginPath();
  ctx.moveTo(LEFT_X, GAME_OVER_LINE_Y);
  ctx.lineTo(RIGHT_X, GAME_OVER_LINE_Y);
  ctx.stroke();
  ctx.setLineDash([]);

  // 壁
  ctx.fillStyle = "#5c3a21";
  ctx.fillRect(0,0,LOGICAL_W,WALL_THICKNESS);
  ctx.fillRect(0,LOGICAL_H-WALL_THICKNESS,LOGICAL_W,WALL_THICKNESS);
  ctx.fillRect(0,0,WALL_THICKNESS,LOGICAL_H);
  ctx.fillRect(LOGICAL_W-WALL_THICKNESS,0,WALL_THICKNESS,LOGICAL_H);

  // 重力矢印
  drawFieldGravityArrow();

  // 投入プレビュー
  if (!gameOver){
    const info = getDropSpawnInfo();
    const f = FRUITS[nextLevel-1];
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(info.x, info.y, f.radius, 0, Math.PI*2);
    ctx.fillStyle = f.color;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ボール
  for (const b of balls){
    drawBall(b);
  }

  // ポップエフェクト
  for (const p of popEffects){
    const t = 1 - p.life/p.maxLife;
    ctx.globalAlpha = 1-t;
    ctx.beginPath();
    ctx.arc(p.x,p.y, p.r*(0.6+t*0.8), 0, Math.PI*2);
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawFieldGravityArrow(){
  const cx = LOGICAL_W/2, cy = LOGICAL_H/2;
  const len = 36;
  const dirx = Math.cos(gravityAngle), diry = Math.sin(gravityAngle);
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.strokeStyle = "#e94560";
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(cx - dirx*len, cy - diry*len);
  ctx.lineTo(cx + dirx*len, cy + diry*len);
  ctx.stroke();

  const ang = Math.atan2(diry,dirx);
  const tipX = cx+dirx*len, tipY = cy+diry*len;
  ctx.beginPath();
  ctx.moveTo(tipX,tipY);
  ctx.lineTo(tipX - 14*Math.cos(ang-0.4), tipY - 14*Math.sin(ang-0.4));
  ctx.lineTo(tipX - 14*Math.cos(ang+0.4), tipY - 14*Math.sin(ang+0.4));
  ctx.closePath();
  ctx.fillStyle = "#e94560";
  ctx.fill();
  ctx.restore();
}

function drawBall(b){
  const f = FRUITS[b.level-1];
  ctx.save();
  
  // チートモード選択中のエフェクト描画
  if (selectedBall === b){
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r + 6, 0, Math.PI*2);
    ctx.fillStyle = "#ffd700";
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fillStyle = f.color;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(0,0,0,0.15)";
  ctx.stroke();

  // ハイライト
  ctx.beginPath();
  ctx.arc(b.x-b.r*0.3, b.y-b.r*0.35, b.r*0.35, 0, Math.PI*2);
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fill();

  // レベル数字
  ctx.fillStyle = "#fff";
  ctx.font = `bold ${Math.max(10,b.r*0.55)}px sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,0.4)";
  ctx.shadowBlur = 3;
  ctx.fillText(String(b.level), b.x, b.y);
  ctx.restore();
}

requestAnimationFrame(step);
resetGame();

})();
</script>
