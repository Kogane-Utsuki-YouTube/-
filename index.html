<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方向重力スイカゲーム</title>
<style>
  :root{
    --bg1:#1a1a2e;
    --bg2:#16213e;
    --panel:#0f3460;
    --accent:#e94560;
    --text:#f1f1f1;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    background:linear-gradient(135deg,var(--bg1),var(--bg2));
    color:var(--text);
    font-family:"Segoe UI","Yu Gothic",sans-serif;
    overflow:hidden;
    -webkit-user-select:none;
    user-select:none;
  }
  #app{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    height:100%;
    padding:8px;
  }
  h1{
    font-size:20px;
    margin:4px 0;
    letter-spacing:1px;
    color:var(--accent);
    text-shadow:0 0 8px rgba(233,69,96,.6);
  }
  #hud{
    display:flex;
    gap:16px;
    align-items:center;
    margin-bottom:6px;
    font-size:14px;
    flex-wrap:wrap;
    justify-content:center;
  }
  #hud .item{
    background:rgba(255,255,255,.06);
    padding:4px 10px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.1);
  }
  #gravityIndicator{
    position:relative;
    width:60px;
    height:60px;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #24345a, #0c1730);
    border:2px solid var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #arrow{
    width:0;height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-bottom:26px solid var(--accent);
    transform-origin:center 60%;
    filter:drop-shadow(0 0 4px rgba(233,69,96,.9));
    transition:transform .12s linear;
  }
  #gravityLabel{
    position:absolute;
    bottom:-20px;
    font-size:11px;
    white-space:nowrap;
    color:#ccc;
  }
  #canvasWrap{
    position:relative;
    border-radius:12px;
    box-shadow:0 0 0 3px var(--panel), 0 8px 24px rgba(0,0,0,.5);
    overflow:hidden;
    background:#fdf6e3;
  }
  canvas{display:block;touch-action:none;}
  #gameOverOverlay{
    position:absolute;
    inset:0;
    background:rgba(10,10,20,.85);
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    z-index:10;
  }
  #gameOverOverlay h2{
    color:var(--accent);
    font-size:28px;
    margin:0;
  }
  #gameOverOverlay p{margin:0;font-size:16px;}
  button{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:10px 22px;
    font-size:15px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    letter-spacing:1px;
  }
  button:hover{filter:brightness(1.1);}
  #help{
    margin-top:8px;
    font-size:12px;
    color:#aaa;
    text-align:center;
    line-height:1.6;
    max-width:480px;
  }
  #help b{color:var(--accent);}
  #nextPreview{
    display:flex;
    align-items:center;
    gap:6px;
  }
  #nextCircle{
    width:26px;height:26px;
    border-radius:50%;
    border:2px solid #fff;
  }
  .touchhint{display:none;}
  @media (max-width:520px){
    .touchhint{display:block;font-size:11px;color:#888;margin-top:4px;}
  }
</style>
</head>
<body>
<div id="app">
  <h1>🍉 方向重力スイカゲーム 🍉</h1>
  <div id="hud">
    <div class="item">スコア: <span id="score">0</span></div>
    <div class="item">ベスト: <span id="best">0</span></div>
    <div class="item nextPreview">次: <span id="nextCircle" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#ff6b6b;color:#fff;font-weight:bold;font-size:12px;vertical-align:middle;"></span></div>
    <div class="item">重力強度: <span id="gravVal">1.0</span></div>
    <div class="item">角度: <span id="gravAngleVal">90°</span></div>
    <button id="shuffleBtn" style="padding:4px 12px;font-size:13px;">🔄 かき混ぜ (<span id="shuffleTimer">OK</span>)</button>
    <div id="gravityIndicator">
      <div id="arrow"></div>
    </div>
  </div>
  <div id="canvasWrap">
    <canvas id="game"></canvas>
    <div id="gameOverOverlay">
      <h2>ゲームオーバー</h2>
      <p>スコア: <span id="finalScore">0</span></p>
      <button id="retryBtn">もう一度</button>
    </div>
  </div>
  <div id="help">
    <b>←→</b>：重力の向きを回転　<b>↑↓</b>：重力の強さを変更　<b>クリック/タップ/移動</b>：フルーツを落とす<br>
    同じ大きさのフルーツをぶつけて合体させよう。11(スイカ)が2つ結合すると消えて特大スコア
    <div class="touchhint">スマホの場合は画面下の左右ボタンで重力方向、上下ボタンで強度を調整できます。</div>
  </div>
</div>

<script>
(function(){
"use strict";

/* ================= 基本設定 ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// 論理サイズ(内部解像度)
const LOGICAL_W = 480;
const LOGICAL_H = 640;
let SCALE = 1;

function resize(){
  const maxW = Math.min(window.innerWidth - 20, 480);
  const maxH = window.innerHeight - 220;
  const scale = Math.min(maxW / LOGICAL_W, maxH / LOGICAL_H, 1.15);
  SCALE = Math.max(scale, 0.5);
  canvas.width = LOGICAL_W * SCALE;
  canvas.height = LOGICAL_H * SCALE;
}
window.addEventListener('resize', resize);
resize();

/* ================= フルーツ定義 (1〜11) ================= */
// レベル1〜11。半径は段階的に増加。11同士が合体したら消滅してボーナス。
const FRUITS = [
  { level:1,  radius:14, color:"#ff5e5e", score:1  , name:"さくらんぼ"},
  { level:2,  radius:19, color:"#ff9f43", score:3  , name:"いちご"},
  { level:3,  radius:25, color:"#feca57", score:6  , name:"ぶどう"},
  { level:4,  radius:31, color:"#ff6b81", score:10 , name:"みかん"},
  { level:5,  radius:38, color:"#54a0ff", score:15 , name:"かき"},
  { level:6,  radius:46, color:"#5f27cd", score:21 , name:"りんご"},
  { level:7,  radius:55, color:"#1dd1a1", score:28 , name:"なし"},
  { level:8,  radius:65, color:"#ff9ff3", score:36 , name:"もも"},
  { level:9,  radius:76, color:"#f368e0", score:45 , name:"パイナップル"},
  { level:10, radius:88, color:"#10ac84", score:55 , name:"メロン"},
  { level:11, radius:102,color:"#2ecc71", score:66 , name:"スイカ"},
];
const MAX_LEVEL = 11;
const MERGE_BONUS_ON_MAX = 500; // 11同士合体で消える時の特大ボーナス

/* ================= 重力システム ================= */
let gravityAngle = -Math.PI/2; // ラジアン。初期は真上→下向き(通常重力=下方向=角度 PI/2)
// 角度の定義: 0 = 右方向, PI/2 = 下方向, PI = 左方向, -PI/2 = 上方向
gravityAngle = Math.PI/2; // 初期状態は通常の重力(下向き)
let gravityStrength = 800.0; // 元exeと同じ単位(px/s^2)
const ANGLE_STEP = Math.PI/180; // 左右キー1回の回転量(1度)
const STRENGTH_STEP = 20; // 0.1相当の細かさ(元exeは100刻み→1/5に細分化)
const STRENGTH_MIN = 100.0;
const STRENGTH_MAX = 2400.0;

function updateGravityIndicator(){
  const arrow = document.getElementById('arrow');
  // arrowはデフォルトで下向きの三角形なので、回転角度は gravityAngle - (下向き=PI/2) 分ずらす
  const deg = (gravityAngle * 180/Math.PI) - 90 + 180; // 三角形の先端が重力方向を向くよう調整
  arrow.style.transform = `rotate(${(gravityAngle*180/Math.PI)-90}deg)`;
  document.getElementById('gravVal').textContent = Math.round(gravityStrength);
  const angDeg = document.getElementById('gravAngleVal');
  if (angDeg) angDeg.textContent = Math.round(((gravityAngle*180/Math.PI)%360+360)%360) + "°";
}

/* ================= 物理エンジン(簡易) ================= */
const WALL_THICKNESS = 14;
const FLOOR_Y = LOGICAL_H - WALL_THICKNESS - 10;
const LEFT_X = WALL_THICKNESS + 10;
const RIGHT_X = LOGICAL_W - WALL_THICKNESS - 10;
const TOP_LIMIT_Y = 90; // ここより上に積み上がったらゲームオーバー判定ライン

let balls = [];
let idCounter = 1;
let score = 0;
let best = parseInt(localStorage.getItem('suika_best_gravity') || "0", 10);
document.getElementById('best').textContent = best;

let gameOver = false;
let dropCooldown = 0;
const DROP_COOLDOWN_MAX = 0.65; // 元exeのDROP_COOLDOWNと同じ
let isDropping = false; // 元exeのg_dropping相当

function randomDropLevel(){
  // 序盤(1〜5)からランダムに出す
  const r = Math.random();
  if (r < 0.35) return 1;
  if (r < 0.6) return 2;
  if (r < 0.8) return 3;
  if (r < 0.93) return 4;
  return 5;
}

let nextLevel = randomDropLevel();
function refreshNextPreview(){
  const f = FRUITS[nextLevel-1];
  const el = document.getElementById('nextCircle');
  el.style.background = f.color;
  el.textContent = f.level;
}
refreshNextPreview();

function createBall(x, y, level){
  const f = FRUITS[level-1];
  return {
    id: idCounter++,
    x, y,
    vx: 0, vy: 0,
    level,
    r: f.radius,
    settled:false,
    justDropped:true,
    dropTime: performance.now()
  };
}

/* 落下位置カーソル(重力方向に応じて画面端から投入) */

const DROP_Y_FIXED = TOP_LIMIT_Y - 45; // 元exeのDROP_Y = BOARD_Y+35相当、常に固定
let cursorX = LOGICAL_W/2; // 元exeのg_cursorX相当。マウス/タッチ/矢印キーで動く水平カーソル
function getDropSpawnInfo(){
  const r = FRUITS[nextLevel-1].radius;
  const cx = Math.min(Math.max(cursorX, LEFT_X+r), RIGHT_X-r);
  return {x: cx, y: DROP_Y_FIXED};
}

function dropBall(){
  if (gameOver) return;
  if (dropCooldown > 0) return;
  const info = getDropSpawnInfo();
  const b = createBall(info.x, info.y, nextLevel);
  balls.push(b);
  dropCooldown = DROP_COOLDOWN_MAX;
  isDropping = true;
  nextLevel = randomDropLevel();
  refreshNextPreview();
}

/* ================= マージ処理 ================= */
let pendingMerges = [];
let popEffects = [];

function tryMerge(a, b){
  if (a.level !== b.level) return false;
  if (a.merging || b.merging) return false;
  const dx = b.x-a.x, dy = b.y-a.y;
  const dist = Math.hypot(dx,dy);
  if (dist < a.r + b.r){
    a.merging = true; b.merging = true;
    pendingMerges.push({a,b});
    return true;
  }
  return false;
}

function processMerges(){
  for (const m of pendingMerges){
    const {a,b} = m;
    if (!balls.includes(a) || !balls.includes(b)) continue;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    if (a.level >= MAX_LEVEL){
      // 11同士 → 消滅
      balls = balls.filter(x=>x!==a && x!==b);
      score += MERGE_BONUS_ON_MAX;
      popEffects.push({x:mx,y:my,r:a.r*1.4,life:0.5,maxLife:0.5,color:"#2ecc71"});
    } else {
      const newLevel = a.level+1;
      balls = balls.filter(x=>x!==a && x!==b);
      const nb = createBall(mx,my,newLevel);
      nb.justDropped = false;
      balls.push(nb);
      score += FRUITS[newLevel-1].score;
      popEffects.push({x:mx,y:my,r:nb.r*1.2,life:0.3,maxLife:0.3,color:FRUITS[newLevel-1].color});
    }
    updateScoreUI();
  }
  pendingMerges = [];
}

function updateScoreUI(){
  document.getElementById('score').textContent = score;
  if (score > best){
    best = score;
    localStorage.setItem('suika_best_gravity', String(best));
    document.getElementById('best').textContent = best;
  }
}

/* ================= ゲームオーバー判定(元exeと同じロジック) ================= */
// 元exe: if (!g_dropping) { for each fruit: if (f.y - r < BOARD_Y+10) gameOver=true; }
const GAME_OVER_LINE_Y = TOP_LIMIT_Y + 10;
function checkGameOver(dt){
  if (isDropping) return; // ドロップ直後のフルーツで誤判定しないよう、元exeと同じくドロップ中はスキップ
  if (isShuffling) return; // シャッフル演出中はゲームオーバー判定を一時停止
  if (gameOverGraceLeft > 0) return; // シャッフル直後5秒間もゲームオーバー判定を無効化
  for (const b of balls){
    if (b.y - b.r < GAME_OVER_LINE_Y){
      triggerGameOver();
      break;
    }
  }
}

function triggerGameOver(){
  if (gameOver) return;
  gameOver = true;
  document.getElementById('finalScore').textContent = score;
  document.getElementById('gameOverOverlay').style.display = 'flex';
}

function resetGame(){
  balls = [];
  score = 0;
  gameOver = false;
  isDropping = false;
  dropCooldown = 0;
  cursorX = LOGICAL_W/2;
  updateScoreUI();
  document.getElementById('gameOverOverlay').style.display = 'none';
  nextLevel = randomDropLevel();
  refreshNextPreview();
  shuffleCooldownLeft = 0;
  isShuffling = false;
  gameOverGraceLeft = 0;
  updateShuffleUI();
}
document.getElementById('retryBtn').addEventListener('click', resetGame);

/* ================= 入力: キーボード ================= */
window.addEventListener('keydown', (e)=>{
  switch(e.key){
    case 'ArrowLeft':
      gravityAngle -= ANGLE_STEP;
      if (!gameOver && !isDropping) cursorX = Math.max(LEFT_X + FRUITS[nextLevel-1].radius, cursorX - 10);
      updateGravityIndicator();
      e.preventDefault();
      break;
    case 'ArrowRight':
      gravityAngle += ANGLE_STEP;
      if (!gameOver && !isDropping) cursorX = Math.min(RIGHT_X - FRUITS[nextLevel-1].radius, cursorX + 10);
      updateGravityIndicator();
      e.preventDefault();
      break;
    case 'ArrowUp':
      gravityStrength = Math.min(STRENGTH_MAX, gravityStrength + STRENGTH_STEP);
      updateGravityIndicator();
      e.preventDefault();
      break;
    case 'ArrowDown':
      gravityStrength = Math.max(STRENGTH_MIN, gravityStrength - STRENGTH_STEP);
      updateGravityIndicator();
      e.preventDefault();
      break;
    case ' ':
      if (gameOver) resetGame(); else dropBall();
      e.preventDefault();
      break;
    case 'r': case 'R':
      resetGame();
      e.preventDefault();
      break;
  }
});

/* ================= 入力: マウス/タッチ ================= */
canvas.addEventListener('mousemove', (e)=>{
  if (isDropping || gameOver) return;
  const rect = canvas.getBoundingClientRect();
  const lx = (e.clientX-rect.left)/SCALE;
  cursorX = lx;
});
canvas.addEventListener('click', (e)=>{
  if (gameOver){ resetGame(); return; }
  const rect = canvas.getBoundingClientRect();
  const lx = (e.clientX-rect.left)/SCALE;
  cursorX = lx;
  dropBall();
});
canvas.addEventListener('touchstart', (e)=>{
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[0];
  const lx = (t.clientX-rect.left)/SCALE;
  cursorX = lx;
  dropBall();
  e.preventDefault();
}, {passive:false});

updateGravityIndicator();

/* ================= シャッフル機能(ボタンで発動、使用後60秒クールダウン、終了後5秒間ゲームオーバー無効) ================= */
const SHUFFLE_COOLDOWN = 60; // 秒、使用後の再使用可能までの時間
let shuffleCooldownLeft = 0; // 0ならボタン使用可能
let isShuffling = false;
let shuffleStartAngle = 0;
let shuffleStartStrength = 800;
let shuffleElapsed = 0;
const SHUFFLE_DURATION = 4.0; // 秒、派手な回転演出の時間(ゆっくり目で見えるように)
const SHUFFLE_SPINS = 3; // 演出中の回転数
let gameOverGraceLeft = 0; // >0の間はゲームオーバー判定を無効化

function doShuffle(){
  if (isShuffling || shuffleCooldownLeft > 0) return;
  isShuffling = true;
  shuffleElapsed = 0;
  shuffleStartAngle = gravityAngle;
  shuffleStartStrength = gravityStrength;
  shuffleCooldownLeft = SHUFFLE_COOLDOWN;
  updateShuffleUI();
}

function updateShuffle(dt){
  if (isShuffling){
    shuffleElapsed += dt;
    const t = Math.min(shuffleElapsed / SHUFFLE_DURATION, 1);
    // 派手な加速→減速の回転(SHUFFLE_SPINS回転して元の角度に戻る)
    const ease = t<0.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;
    gravityAngle = shuffleStartAngle + ease * (Math.PI*2*SHUFFLE_SPINS);
    // 強さも演出中は激しく揺れ動かす(見た目のみ、終了後は元に戻す)
    gravityStrength = shuffleStartStrength + Math.sin(shuffleElapsed*40) * shuffleStartStrength*0.3*(1-t);
    if (t >= 1){
      gravityAngle = ((shuffleStartAngle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2); // 元の方向にきっちり戻す(正規化)
      gravityStrength = shuffleStartStrength; // 強さも元に戻す
      isShuffling = false;
      gameOverGraceLeft = 5; // 終了後5秒間はゲームオーバー判定を無効化
    }
    updateGravityIndicator();
  }

  if (shuffleCooldownLeft > 0){
    shuffleCooldownLeft = Math.max(0, shuffleCooldownLeft - dt);
    updateShuffleUI();
  }
  if (gameOverGraceLeft > 0){
    gameOverGraceLeft = Math.max(0, gameOverGraceLeft - dt);
  }
}

function updateShuffleUI(){
  const btn = document.getElementById('shuffleBtn');
  const el = document.getElementById('shuffleTimer');
  if (shuffleCooldownLeft > 0){
    if (el) el.textContent = Math.ceil(shuffleCooldownLeft);
    if (btn) btn.disabled = true;
  } else {
    if (el) el.textContent = "OK";
    if (btn) btn.disabled = false;
  }
}

document.getElementById('shuffleBtn').addEventListener('click', doShuffle);


/* ================= メインループ ================= */
let lastTime = performance.now();

function step(now){
  let dt = (now-lastTime)/1000;
  lastTime = now;
  dt = Math.min(dt, 1/30); // 大きすぎるdtを防ぐ

  if (isDropping){
    dropCooldown -= dt;
    if (dropCooldown <= 0){ isDropping = false; }
  }

  if (!gameOver){
    updatePhysics(dt);
    checkGameOver(dt);
    updateShuffle(dt);
  }
  updatePopEffects(dt);
  render();
  requestAnimationFrame(step);
}

const SUBSTEPS = 8; // 元exeと同じサブステップ数
const DAMPING = 0.4;   // 元exe: 底面バウンド減衰
const FRICTION = 0.88; // 元exe: 底面横摩擦
const WALL_BOUNCE = 0.6; // 元exe: 左右壁の反発

function updatePhysics(dt){
  const subDt = dt / SUBSTEPS;
  // 元exeの式そのまま: gx = strength*cos(angle - PI/2), gy = strength*sin(angle - PI/2)
  const gx = gravityStrength * Math.cos(gravityAngle);
  const gy = gravityStrength * Math.sin(gravityAngle);

  for (let s=0; s<SUBSTEPS; s++){
    // 積分
    for (const b of balls){
      if (b.merging) continue;
      b.vx += gx*subDt;
      b.vy += gy*subDt;
      b.x  += b.vx*subDt;
      b.y  += b.vy*subDt;
    }

    // 壁との衝突(元exeと同じ反発係数)
    for (const b of balls){
      if (b.merging) continue;
      const r = b.r;
      if (b.x - r < LEFT_X){ b.x = LEFT_X + r; b.vx = Math.abs(b.vx) * WALL_BOUNCE; }
      if (b.x + r > RIGHT_X){ b.x = RIGHT_X - r; b.vx = -Math.abs(b.vx) * WALL_BOUNCE; }
      if (b.y - r < WALL_THICKNESS){ b.y = WALL_THICKNESS + r; b.vy = Math.abs(b.vy) * WALL_BOUNCE; }
      if (b.y + r > LOGICAL_H - WALL_THICKNESS){
        b.y = LOGICAL_H - WALL_THICKNESS - r;
        b.vy = -Math.abs(b.vy) * DAMPING;
        b.vx *= FRICTION;
      }
    }

    // フルーツ同士の衝突(元exeと同じ処理: 押し離し+反発0.55、同レベルなら合体)
    const n = balls.length;
    for (let i=0;i<n;i++){
      const a = balls[i];
      if (!a || a.merging) continue;
      for (let j=i+1;j<n;j++){
        const b = balls[j];
        if (!b || b.merging) continue;
        const dx=b.x-a.x, dy=b.y-a.y;
        const dist = Math.hypot(dx,dy);
        const minD = a.r+b.r;
        if (dist < minD && dist > 0.001){
          if (a.level === b.level && !a.justDropped && !b.justDropped){
            tryMerge(a,b);
            continue;
          }
          const nx = dx/dist, ny = dy/dist;
          const overlap = (minD-dist)*0.5;
          a.x -= nx*overlap; a.y -= ny*overlap;
          b.x += nx*overlap; b.y += ny*overlap;
          const rvx = b.vx-a.vx, rvy = b.vy-a.vy;
          const dot = rvx*nx + rvy*ny;
          if (dot < 0){
            const imp = dot * 0.55;
            a.vx += imp*nx; a.vy += imp*ny;
            b.vx -= imp*nx; b.vy -= imp*ny;
          }
        }
      }
    }
  }

  for (const b of balls){
    if (b.justDropped && performance.now() - b.dropTime > 200){
      b.justDropped = false;
    }
  }

  if (pendingMerges.length>0) processMerges();
  balls = balls.filter(b=>!b.merging || pendingMerges.some(m=>m.a===b||m.b===b));
}

function updatePopEffects(dt){
  for (const p of popEffects){
    p.life -= dt;
  }
  popEffects = popEffects.filter(p=>p.life>0);
}

/* ================= 描画 ================= */
function render(){
  ctx.save();
  ctx.scale(SCALE, SCALE);
  ctx.clearRect(0,0,LOGICAL_W,LOGICAL_H);

  // 背景
  const grad = ctx.createLinearGradient(0,0,0,LOGICAL_H);
  grad.addColorStop(0, "#fff8e7");
  grad.addColorStop(1, "#ffe9c7");
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,LOGICAL_W,LOGICAL_H);

  // 上部危険ライン
  ctx.strokeStyle = "rgba(233,69,96,0.4)";
  ctx.setLineDash([6,6]);
  ctx.beginPath();
  ctx.moveTo(LEFT_X, GAME_OVER_LINE_Y);
  ctx.lineTo(RIGHT_X, GAME_OVER_LINE_Y);
  ctx.stroke();
  ctx.setLineDash([]);

  // 壁
  ctx.fillStyle = "#5c3a21";
  ctx.fillRect(0,0,LOGICAL_W,WALL_THICKNESS); // 上
  ctx.fillRect(0,LOGICAL_H-WALL_THICKNESS,LOGICAL_W,WALL_THICKNESS); // 下
  ctx.fillRect(0,0,WALL_THICKNESS,LOGICAL_H); // 左
  ctx.fillRect(LOGICAL_W-WALL_THICKNESS,0,WALL_THICKNESS,LOGICAL_H); // 右

  // 重力方向の矢印を盤面内にも薄く表示
  drawFieldGravityArrow();

  // 投入プレビュー位置
  if (!gameOver){
    const info = getDropSpawnInfo();
    const f = FRUITS[nextLevel-1];
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(info.x, info.y, f.radius, 0, Math.PI*2);
    ctx.fillStyle = f.color;
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // ボール
  for (const b of balls){
    drawBall(b);
  }

  // ポップエフェクト
  for (const p of popEffects){
    const t = 1 - p.life/p.maxLife;
    ctx.globalAlpha = 1-t;
    ctx.beginPath();
    ctx.arc(p.x,p.y, p.r*(0.6+t*0.8), 0, Math.PI*2);
    ctx.strokeStyle = p.color;
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

function drawFieldGravityArrow(){
  const cx = LOGICAL_W/2, cy = LOGICAL_H/2;
  const len = 36;
  const dirx = Math.cos(gravityAngle), diry = Math.sin(gravityAngle);
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.strokeStyle = "#e94560";
  ctx.lineWidth = 8;
  ctx.beginPath();
  ctx.moveTo(cx - dirx*len, cy - diry*len);
  ctx.lineTo(cx + dirx*len, cy + diry*len);
  ctx.stroke();
  // 矢じり
  const ang = Math.atan2(diry,dirx);
  const tipX = cx+dirx*len, tipY = cy+diry*len;
  ctx.beginPath();
  ctx.moveTo(tipX,tipY);
  ctx.lineTo(tipX - 14*Math.cos(ang-0.4), tipY - 14*Math.sin(ang-0.4));
  ctx.lineTo(tipX - 14*Math.cos(ang+0.4), tipY - 14*Math.sin(ang+0.4));
  ctx.closePath();
  ctx.fillStyle = "#e94560";
  ctx.fill();
  ctx.restore();
}

function drawBall(b){
  const f = FRUITS[b.level-1];
  ctx.save();
  ctx.beginPath();
  ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
  ctx.fillStyle = f.color;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = "rgba(0,0,0,0.15)";
  ctx.stroke();

  // ハイライト
  ctx.beginPath();
  ctx.arc(b.x-b.r*0.3, b.y-b.r*0.35, b.r*0.35, 0, Math.PI*2);
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  ctx.fill();

  // レベル数字
  ctx.fillStyle = "#fff";
  ctx.font = `bold ${Math.max(10,b.r*0.55)}px sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = "rgba(0,0,0,0.4)";
  ctx.shadowBlur = 3;
  ctx.fillText(String(b.level), b.x, b.y);
  ctx.restore();
}

requestAnimationFrame(step);
resetGame();

})();
</script>
